name: CI

on:
    push:
        branches:
            - "**"
    pull_request:

jobs:
    testes:
        name: Testes (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false # um sistema falhando não esconde o resultado dos outros
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - name: Baixar o código
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Instalar o bot e as ferramentas de desenvolvimento
              run: python -m pip install -e ".[dev]"

            - name: Mostrar o gcc (os testes que compilam C são pulados sem ele)
              run: gcc --version
              continue-on-error: true

            - name: Rodar os testes (pytest)
              run: python -m pytest -q

    qualidade:
        name: Pylint, extensão e scripts
        runs-on: ubuntu-latest

        steps:
            - name: Baixar o código
              uses: actions/checkout@v4

            - name: Configurar Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Instalar o bot e as ferramentas de desenvolvimento
              run: python -m pip install -e ".[dev]"

            - name: Pylint no código (nota mínima 9.5)
              run: pylint bot_moodle --fail-under=9.5

            - name: Pylint nos testes (o nome do teste faz o papel da docstring)
              run: pylint tests --fail-under=9.5 --disable=missing-function-docstring,missing-class-docstring,protected-access

            - name: Configurar Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Testes da extensão (node --test)
              run: node --test "extensao/tests/*.test.js"

            - name: Sintaxe do start.sh
              run: bash -n start.sh
